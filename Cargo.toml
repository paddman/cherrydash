[workspace]
members = [
  "crates/cherrydash-core",
  "services/cherrydash-server",
  "services/cherrydash-ingest",
  "agents/cherrydash-edge",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["CherryDash contributors"]
repository = "https://github.com/paddman/cherrydash"
homepage = "https://github.com/paddman/cherrydash"
publish = false

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http2", "json", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ulid = { version = "1.2", features = ["serde"] }
