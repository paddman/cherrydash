name: ${COMPOSE_PROJECT_NAME:-cherrydash}

services:
  server:
    build:
      context: ../..
      dockerfile: deploy/docker/server.Dockerfile
    environment:
      CHERRYDASH_BIND_ADDR: 0.0.0.0:8080
      CHERRYDASH_ENVIRONMENT: ${CHERRYDASH_ENVIRONMENT:-development}
      CHERRYDASH_LOG_JSON: "true"
      RUST_LOG: ${RUST_LOG:-cherrydash=info,tower_http=info}
    ports:
      - "${CHERRYDASH_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [cherrydash]

  ingest:
    build:
      context: ../..
      dockerfile: deploy/docker/ingest.Dockerfile
    environment:
      CHERRYDASH_INGEST_BIND_ADDR: 0.0.0.0:8081
      CHERRYDASH_INGEST_WAL_PATH: /var/lib/cherrydash/ingest/events.ndjson
      CHERRYDASH_INGEST_SYNC_WRITES: ${CHERRYDASH_INGEST_SYNC_WRITES:-false}
      CHERRYDASH_LOG_JSON: "true"
      RUST_LOG: ${RUST_LOG:-cherrydash=info,tower_http=info}
    volumes:
      - ingest-wal:/var/lib/cherrydash/ingest
    ports:
      - "${CHERRYDASH_INGEST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [cherrydash]

  edge:
    build:
      context: ../..
      dockerfile: deploy/docker/edge.Dockerfile
    environment:
      CHERRYDASH_INGEST_URL: http://ingest:8081
      CHERRYDASH_TENANT_ID: ${CHERRYDASH_TENANT_ID:-default}
      CHERRYDASH_EDGE_ID: compose-edge-01
      CHERRYDASH_EDGE_INTERVAL_SECONDS: 15
      CHERRYDASH_LOG_JSON: "true"
      RUST_LOG: ${RUST_LOG:-cherrydash=info}
    depends_on:
      ingest:
        condition: service_healthy
    restart: unless-stopped
    networks: [cherrydash]

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    ports:
      - "${CHERRYDASH_WEB_PORT:-3000}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    networks: [cherrydash]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cherrydash}
      POSTGRES_USER: ${POSTGRES_USER:-cherrydash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cherrydash-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/postgres/001_control_plane.sql:/docker-entrypoint-initdb.d/001_control_plane.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [cherrydash]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-cherrydash}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-cherrydash}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-cherrydash-dev-only}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ../sql/clickhouse/001_telemetry.sql:/docker-entrypoint-initdb.d/001_telemetry.sql:ro
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [cherrydash]

  nats:
    image: nats:2.11-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - nats-data:/data
      - ../nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    restart: unless-stopped
    networks: [cherrydash]

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [cherrydash]

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cherrydash}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cherrydash-dev-only}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    restart: unless-stopped
    networks: [cherrydash]

networks:
  cherrydash:
    driver: bridge

volumes:
  ingest-wal:
  postgres-data:
  clickhouse-data:
  nats-data:
  valkey-data:
  minio-data:
