server_name: cherrydash-nats-1
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1GiB
  max_file_store: 20GiB
}

authorization {
  users: [
    {
      user: $CHERRYDASH_NATS_USER
      password: $CHERRYDASH_NATS_PASSWORD
      permissions: {
        publish: { allow: ["cherrydash.>"] }
        subscribe: { allow: ["cherrydash.>", "_INBOX.>"] }
      }
    }
  ]
}

write_deadline: "10s"
max_payload: 8MiB
