# SPDX-License-Identifier: AGPL-3.0-only
name: License policy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  licensing:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify license boundaries, metadata, and SPDX tags
        run: python3 scripts/license_policy.py --check
